<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>动画日程 · line puppy</title>
  <style>
    :root {
      --bg: #181825;
      --panel: #1e1e2e;
      --card: #232336;
      --card-2: #2a2a40;
      --text: #e6e6f0;
      --muted: #9a9ab0;
      --accent: #89b4fa;
      --accent-2: #a6e3a1;
      --border: #363650;
      --danger: #f38ba8;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }
    header {
      padding: 18px 20px 14px;
      background: linear-gradient(180deg, #232336, #1e1e2e);
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0 0 4px; font-size: 17px; }
    header p { margin: 0; color: var(--muted); font-size: 12px; }
    main { padding: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title { margin: 0 0 2px; font-size: 14px; font-weight: 700; }
    .card-desc { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
    button, select, input { font-family: inherit; font-size: 13px; }
    .btn-add, .btn-import, .btn-ghost, .btn-save, .btn-cancel {
      border-radius: 8px; cursor: pointer; font-weight: 600; border: 1px solid transparent;
    }
    .btn-add { background: var(--accent); color: #11111b; padding: 7px 12px; }
    .btn-import { background: var(--card-2); color: var(--text); border-color: var(--border); padding: 7px 12px; }
    .btn-ghost { background: var(--card-2); color: var(--text); border-color: var(--border); padding: 7px 12px; }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn-add:hover, .btn-import:hover { filter: brightness(1.08); }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .template-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .template-card {
      background: var(--card-2); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; cursor: pointer; transition: border-color .15s, transform .1s;
    }
    .template-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .template-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .template-desc { color: var(--muted); font-size: 11px; }
    .entry {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px; margin: 8px 0; background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px;
    }
    .entry-system { background: #20203a; }
    .entry.dragging { opacity: .4; }
    .entry.placeholder { background: transparent; border: 2px dashed var(--accent); height: 48px; }
    .drag-handle { cursor: grab; color: var(--muted); font-size: 16px; user-select: none; line-height: 1; flex: 0 0 auto; }
    .entry-icon { font-size: 15px; width: 18px; text-align: center; flex: 0 0 auto; }
    .entry-head { display: flex; align-items: center; gap: 6px; flex: 1; flex-wrap: wrap; }
    .entry-type, .entry-start, .entry-end {
      background: var(--card-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 6px;
    }
    .entry-start, .entry-end { width: 64px; text-align: center; }
    .entry-int { display: flex; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; }
    .entry-del {
      background: transparent; color: var(--danger); border: 1px solid var(--danger);
      border-radius: 6px; padding: 3px 8px; cursor: pointer; margin-left: auto;
    }
    .entry-del:hover { background: var(--danger); color: #11111b; }
    .badge-system { background: var(--border); color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 11px; margin-left: auto; }
    .entry-effects { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; width: 100%; padding-top: 8px; margin-top: 6px; border-top: 1px dashed var(--border); }
    .effect-chip {
      display: inline-flex; align-items: center; gap: 4px; background: var(--card-2);
      border: 1px solid var(--accent); color: var(--accent); border-radius: 14px;
      padding: 2px 4px 2px 10px; font-size: 12px;
    }
    .chip-x { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
    .chip-x:hover { color: var(--danger); }
    .effect-add { background: var(--card-2); color: var(--text); border: 1px dashed var(--border); border-radius: 14px; padding: 2px 8px; cursor: pointer; }
    .gif-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
    .gif-thumb { width: 34px; height: 34px; object-fit: contain; background: var(--panel); border-radius: 6px; border: 1px solid var(--border); flex: 0 0 auto; }
    .gif-label { flex: 1; word-break: break-all; }
    .gif-del { background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 6px; padding: 3px 10px; cursor: pointer; flex: 0 0 auto; }
    .gif-del:hover { background: var(--danger); color: #11111b; }
    .hint { color: var(--muted); font-size: 11px; }
    #footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 16px 20px; border-top: 1px solid var(--border); background: var(--panel); position: sticky; bottom: 0; }
    .btn-save { background: var(--accent-2); color: #11111b; padding: 8px 18px; }
    .btn-cancel { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 8px 18px; }
  </style>
</head>
<body>
  <header>
    <h1>动画日程</h1>
    <p>设置桌宠在每个时间段播放的动图。支持导入自己的 GIF 与一键套用模板。</p>
  </header>

  <main>
    <!-- 预设模板 -->
    <section class="card">
      <h2 class="card-title">🧩 预设模板</h2>
      <p class="card-desc">一键套用常见日程，会替换「时间线」里的自定义动画（系统内置不受影响）。</p>
      <div id="template-list" class="template-grid"></div>
    </section>

    <!-- 时间线 -->
    <section class="card">
      <h2 class="card-title">⏱ 时间线</h2>
      <p class="card-desc">自定义动画按顺序排列，可拖动 ⠿ 调整；🔒 为系统内置，不可删除、可停用。</p>
      <div id="timeline-list"></div>
      <div class="row-actions">
        <button class="btn-add" id="btn-add-scheduled">+ 定时动画</button>
        <button class="btn-add" id="btn-add-timed">+ 时段动画</button>
      </div>
    </section>

    <!-- 我的 GIF -->
    <section class="card">
      <h2 class="card-title">🖼 我的 GIF</h2>
      <p class="card-desc">导入自己的动图，添加到时间线效果里。</p>
      <button class="btn-import" id="btn-import-gif">📥 导入 GIF</button>
      <div id="custom-gifs-list"></div>
    </section>

    <!-- 备份与恢复 -->
    <section class="card">
      <h2 class="card-title">💾 备份与恢复</h2>
      <p class="card-desc">覆盖安装或换电脑时，先「导出配置」保存日程与 GIF，需要时再「导入配置」还原。</p>
      <div class="row-actions">
        <button class="btn-ghost" id="btn-export">导出配置</button>
        <button class="btn-ghost" id="btn-import">导入配置</button>
      </div>
    </section>
  </main>

  <div id="footer">
    <button class="btn-cancel" id="btn-cancel">取消</button>
    <button class="btn-save" id="btn-save">保存</button>
  </div>

  <script>
    const ALL_EFFECTS = [
      { value: "love520", label: "520（我爱你）" },
      { value: "love521", label: "521（我愿意）" },
      { value: "heart", label: "爱心" },
      { value: "jump", label: "弹跳" },
      { value: "mealtime", label: "用餐" },
      { value: "sleep", label: "入睡" },
      { value: "sleep2", label: "熟睡" },
      { value: "morningReading", label: "晨读" },
      { value: "morningDrink", label: "晨饮" },
      { value: "afterWork", label: "下班" },
      { value: "send", label: "发送" },
      { value: "good", label: "点赞" },
      { value: "delete", label: "删除" },
      { value: "undo", label: "撤销" },
      { value: "special", label: "特殊" },
      { value: "music", label: "音乐" },
      { value: "scroll", label: "滚动" },
      { value: "default", label: "默认（睡眠）" },
    ];

    const TEMPLATES = [
      {
        id: "workday",
        name: "工作日",
        desc: "520·521 + 晨读 + 晨饮 + 下班；三餐/睡眠交给系统内置",
        windows: [
          { type: "scheduled", start: "05:20", effects: ["love520"] },
          { type: "scheduled", start: "17:20", effects: ["love520"] },
          { type: "scheduled", start: "05:21", effects: ["love521"] },
          { type: "scheduled", start: "17:21", effects: ["love521"] },
          { type: "timed", start: "10:30", end: "10:40", effects: ["morningReading"], interruptible: true },
          { type: "timed", start: "10:40", end: "10:50", effects: ["morningDrink"], interruptible: true },
          { type: "timed", start: "18:00", end: "19:00", effects: ["afterWork"], interruptible: true },
        ],
      },
      {
        id: "minimal",
        name: "极简",
        desc: "只留 520·521 定时；其余交给系统内置，最干净",
        windows: [
          { type: "scheduled", start: "05:20", effects: ["love520"] },
          { type: "scheduled", start: "17:20", effects: ["love520"] },
          { type: "scheduled", start: "05:21", effects: ["love521"] },
          { type: "scheduled", start: "17:21", effects: ["love521"] },
        ],
      },
      {
        id: "freetime",
        name: "自由",
        desc: "520·521 + 下班；去掉晨读/晨饮，更轻松",
        windows: [
          { type: "scheduled", start: "05:20", effects: ["love520"] },
          { type: "scheduled", start: "17:20", effects: ["love520"] },
          { type: "scheduled", start: "05:21", effects: ["love521"] },
          { type: "scheduled", start: "17:21", effects: ["love521"] },
          { type: "timed", start: "18:00", end: "19:00", effects: ["afterWork"], interruptible: true },
        ],
      },
    ];

    let scheduleData = { windows: [], system: [] };
    let customGifList = [];

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function labelFor(value) {
      const builtin = ALL_EFFECTS.find(e => e.value === value);
      if (builtin) return builtin.label;
      const custom = customGifList.find(g => g.value === value);
      if (custom) return custom.label;
      return value;
    }
    const uid = () => "u" + Math.random().toString(36).slice(2, 9);
    function findEntry(id) {
      return scheduleData.windows.find(e => e.id === id) || scheduleData.system.find(e => e.id === id);
    }

    function renderEntry(entry, isSystem) {
      const icon = isSystem ? "🔒" : (entry.type === "scheduled" ? "⏰" : "🕐");
      const typeLabel = entry.type === "scheduled" ? "定时" : "时段";
      const effectChips = (entry.effects || []).map(e =>
        `<span class="effect-chip" data-effect="${e}">${escapeHtml(labelFor(e))}<button class="chip-x" data-effect="${e}" title="移除">×</button></span>`
      ).join("");
      const builtinOpts = ALL_EFFECTS.map(e => `<option value="${e.value}">${e.label}</option>`).join("");
      const customOpts = customGifList.length
        ? `<optgroup label="我的 GIF">${customGifList.map(g => `<option value="${g.value}">${escapeHtml(g.label)}</option>`).join("")}</optgroup>`
        : "";
      const isTimed = entry.type === "timed";
      const toggleHtml = isSystem
        ? `<label class="entry-int"><input type="checkbox" data-field="enabled" ${entry.enabled !== false ? "checked" : ""} />启用</label><span class="badge-system">系统</span>`
        : (isTimed ? `<label class="entry-int"><input type="checkbox" data-field="interruptible" ${entry.interruptible ? "checked" : ""} />可打断</label>` : "");
      return `
      <div class="entry ${isSystem ? "entry-system" : ""}" data-id="${entry.id}" data-system="${isSystem}">
        ${isSystem ? "" : '<div class="drag-handle" title="拖动排序">⠿</div>'}
        <div class="entry-icon" title="${isSystem ? "系统内置" : typeLabel}">${icon}</div>
        <div class="entry-head">
          <select class="entry-type" ${isSystem ? "disabled" : ""}>
            <option value="scheduled" ${entry.type === "scheduled" ? "selected" : ""}>定时</option>
            <option value="timed" ${entry.type === "timed" ? "selected" : ""}>时段</option>
          </select>
          <input class="entry-start" data-field="start" value="${entry.start || ""}" placeholder="HH:MM" />
          ${isTimed ? `<span class="entry-sep">至</span><input class="entry-end" data-field="end" value="${entry.end || ""}" placeholder="HH:MM" />` : ""}
          ${toggleHtml}
        </div>
        <div class="entry-effects" data-id="${entry.id}">
          ${effectChips}
          <select class="effect-add" data-id="${entry.id}">
            <option value="">+ 添加 GIF</option>
            <optgroup label="内置动画">${builtinOpts}</optgroup>
            ${customOpts}
          </select>
        </div>
      </div>`;
    }

    function renderTimeline() {
      const list = document.getElementById("timeline-list");
      const windowsHtml = scheduleData.windows.map(e => renderEntry(e, false)).join("");
      const systemHtml = scheduleData.system.map(e => renderEntry(e, true)).join("");
      list.innerHTML = windowsHtml + systemHtml;
    }

    function renderTemplates() {
      document.getElementById("template-list").innerHTML = TEMPLATES.map(t => `
        <div class="template-card" data-template="${t.id}">
          <div class="template-name">${escapeHtml(t.name)}</div>
          <div class="template-desc">${escapeHtml(t.desc)}</div>
        </div>`).join("");
    }

    function renderCustomGifs() {
      const list = document.getElementById("custom-gifs-list");
      if (!customGifList.length) {
        list.innerHTML = '<div class="hint" style="padding-top:8px">暂无导入的 GIF。点击上方「📥 导入 GIF」添加你自己的动图。</div>';
        return;
      }
      list.innerHTML = customGifList.map(g => `
        <div class="gif-item" data-value="${escapeHtml(g.value)}">
          <img class="gif-thumb" src="gif://${encodeURIComponent(g.file)}" alt="" onerror="this.style.display='none'" />
          <span class="gif-label">${escapeHtml(g.label)}</span>
          <button class="gif-del" data-value="${escapeHtml(g.value)}" title="删除该 GIF">删除</button>
        </div>`).join("");
    }

    // ---- Event delegation ----
    document.addEventListener("change", (e) => {
      const t = e.target;
      const entryEl = t.closest(".entry");
      if (!entryEl) return;
      const id = entryEl.dataset.id;
      const entry = findEntry(id);
      if (!entry) return;
      if (t.classList.contains("entry-type")) {
        entry.type = t.value;
        if (entry.type === "timed") {
          if (!entry.end) entry.end = entry.start || "12:00";
          entry.interruptible = entry.interruptible ?? true;
        } else {
          delete entry.end;
          entry.interruptible = false;
        }
        renderTimeline();
      } else if (t.dataset.field === "start") {
        entry.start = t.value;
      } else if (t.dataset.field === "end") {
        entry.end = t.value;
      } else if (t.dataset.field === "interruptible") {
        entry.interruptible = t.checked;
      } else if (t.dataset.field === "enabled") {
        entry.enabled = t.checked;
      } else if (t.classList.contains("effect-add")) {
        const val = t.value;
        if (val && !entry.effects.includes(val)) entry.effects.push(val);
        t.value = "";
        renderTimeline();
      }
    });

    // Delete an imported GIF from the library, and strip every reference to it.
    document.getElementById("custom-gifs-list").addEventListener("click", async (e) => {
      const btn = e.target.closest(".gif-del");
      if (!btn) return;
      const value = btn.dataset.value;
      const asset = customGifList.find(g => g.value === value);
      const label = asset ? asset.label : value;
      if (!confirm(`确定删除 GIF「${label}」吗？\n该文件将被永久删除，且所有引用它的动画时段也会一并移除。`)) return;
      const res = await window.linePuppySettings.deleteGif(value);
      if (res && res.ok) {
        const strip = (entry) => { if (entry.effects) entry.effects = entry.effects.filter(x => x !== value); };
        scheduleData.windows.forEach(strip);
        scheduleData.system.forEach(strip);
        customGifList = customGifList.filter(g => g.value !== value);
        renderTimeline();
        renderCustomGifs();
      } else {
        alert("删除失败：" + (res && res.error ? res.error : "未知错误"));
      }
    });

    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("chip-x")) {
        const container = e.target.closest(".entry-effects");
        const id = container.dataset.id;
        const val = e.target.dataset.effect;
        const entry = findEntry(id);
        if (entry) entry.effects = entry.effects.filter(x => x !== val);
        renderTimeline();
      } else if (e.target.classList.contains("entry-del")) {
        const id = e.target.closest(".entry").dataset.id;
        const idx = scheduleData.windows.findIndex(en => en.id === id);
        if (idx >= 0) scheduleData.windows.splice(idx, 1);
        renderTimeline();
      }
    });

    // Apply a template (replaces custom windows, keeps system entries).
    document.getElementById("template-list").addEventListener("click", (e) => {
      const card = e.target.closest(".template-card");
      if (!card) return;
      const tpl = TEMPLATES.find(t => t.id === card.dataset.template);
      if (!tpl) return;
      if (!confirm(`套用「${tpl.name}」模板会替换当前的自定义动画，确定吗？`)) return;
      scheduleData.windows = tpl.windows.map(w => ({ ...w, id: uid(), effects: [...(w.effects || [])] }));
      renderTimeline();
    });

    // ---- Drag reorder (custom entries only) ----
    let draggedEntry = null;
    let placeholder = null;
    document.addEventListener("mousedown", (e) => {
      const handle = e.target.closest(".drag-handle");
      if (!handle) return;
      const entryEl = handle.closest(".entry");
      draggedEntry = { el: entryEl, id: entryEl.dataset.id };
      placeholder = document.createElement("div");
      placeholder.className = "entry placeholder";
      placeholder.style.height = entryEl.offsetHeight + "px";
      entryEl.parentNode.insertBefore(placeholder, entryEl.nextSibling);
      entryEl.classList.add("dragging");
    });
    document.addEventListener("mousemove", (e) => {
      if (!draggedEntry) return;
      const elUnder = document.elementFromPoint(e.clientX, e.clientY);
      const entryEl = elUnder && elUnder.closest('.entry:not(.entry-system):not(.placeholder)');
      if (entryEl && entryEl !== draggedEntry.el) {
        const rect = entryEl.getBoundingClientRect();
        const before = (e.clientY - rect.top) / rect.height < 0.5;
        entryEl.parentNode.insertBefore(placeholder, before ? entryEl : entryEl.nextSibling);
      }
    });
    document.addEventListener("mouseup", () => {
      if (!draggedEntry) return;
      const entries = [...document.querySelectorAll('#timeline-list .entry:not(.entry-system)')];
      const dropIdx = entries.indexOf(placeholder);
      const orderedIds = entries
        .filter(el => el !== draggedEntry.el && el !== placeholder)
        .map(el => el.dataset.id);
      orderedIds.splice(dropIdx < 0 ? orderedIds.length : dropIdx, 0, draggedEntry.id);
      const byId = new Map(scheduleData.windows.map(e => [e.id, e]));
      const reordered = orderedIds.map(id => byId.get(id)).filter(Boolean);
      for (const e of scheduleData.windows) if (!orderedIds.includes(e.id)) reordered.push(e);
      scheduleData.windows = reordered;
      if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
      draggedEntry.el.classList.remove("dragging");
      draggedEntry = null;
      placeholder = null;
      renderTimeline();
    });

    // ---- Buttons ----
    document.getElementById("btn-add-scheduled").addEventListener("click", () => {
      scheduleData.windows.push({ id: uid(), type: "scheduled", start: "12:00", effects: [], interruptible: false, enabled: true });
      renderTimeline();
    });
    document.getElementById("btn-add-timed").addEventListener("click", () => {
      scheduleData.windows.push({ id: uid(), type: "timed", start: "12:00", end: "13:00", effects: [], interruptible: true, enabled: true });
      renderTimeline();
    });
    document.getElementById("btn-import-gif").addEventListener("click", async () => {
      const res = await window.linePuppySettings.importGif();
      if (res && res.ok && res.asset) {
        if (!customGifList.find(g => g.value === res.asset.value)) customGifList.push(res.asset);
        renderTimeline();
        renderCustomGifs();
      }
    });
    document.getElementById("btn-cancel").addEventListener("click", () => window.close());
    document.getElementById("btn-save").addEventListener("click", async () => {
      const res = await window.linePuppySettings.saveSchedule({
        windows: scheduleData.windows.map(e => ({ ...e, effects: e.effects || [] })),
        system: scheduleData.system.map(e => ({ ...e, effects: e.effects || [], enabled: e.enabled !== false })),
      });
      if (res && !res.ok) {
        alert("保存失败：" + (res.error || "未知错误"));
        return;
      }
      window.close();
    });
    document.getElementById("btn-export").addEventListener("click", async () => {
      const res = await window.linePuppySettings.exportConfig();
      if (res && res.ok) alert("配置已导出到：\n" + res.path);
      else if (res && res.error) alert("导出失败：" + res.error);
    });
    document.getElementById("btn-import").addEventListener("click", async () => {
      if (!confirm("导入配置会覆盖当前日程和 GIF，确定继续吗？\n建议先点「导出配置」备份。")) return;
      const res = await window.linePuppySettings.importConfig();
      if (res && res.ok) {
        reloadAll();
        alert("配置导入成功。");
      } else if (res && res.error) alert("导入失败：" + res.error);
    });

    // ---- Init ----
    const normalize = (e) => {
      if (!e.effects) e.effects = e.effect ? [e.effect] : [];
      delete e.effect;
      return e;
    };
    function reloadAll() {
      return window.linePuppySettings.loadSchedule()
        .then(data => {
          scheduleData = {
            windows: (data.windows || []).map(normalize),
            system: (data.system || []).map(normalize),
          };
          return window.linePuppySettings.getCustomGifs();
        })
        .then(custom => {
          customGifList = Array.isArray(custom) ? custom : [];
          renderTimeline();
          renderCustomGifs();
        });
    }
    renderTemplates();
    reloadAll();
  </script>
</body>
</html>
