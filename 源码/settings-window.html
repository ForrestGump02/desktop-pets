<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>动画日程</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --panel: #282838;
      --panel-2: #313147;
      --text: #e6e6f0;
      --muted: #9a9ab0;
      --accent: #89b4fa;
      --accent-2: #a6e3a1;
      --border: #3a3a52;
      --danger: #f38ba8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { margin: 0 0 4px; font-size: 16px; }
    header p { margin: 0; color: var(--muted); font-size: 12px; }
    #add-section {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      flex-wrap: wrap;
    }
    button, select, input {
      font-family: inherit;
      font-size: 13px;
    }
    .btn-add, .btn-import {
      background: var(--accent);
      color: #11111b;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-import { background: var(--accent-2); }
    .btn-add:hover, .btn-import:hover { filter: brightness(1.08); }
    .list-title {
      margin: 14px 16px 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .entry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin: 6px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .entry.dragging { opacity: 0.45; }
    .entry.placeholder { background: transparent; border: 2px dashed var(--accent); height: 44px; }
    .drag-handle {
      cursor: grab;
      color: var(--muted);
      font-size: 16px;
      user-select: none;
      line-height: 1;
    }
    .entry-head { display: flex; align-items: center; gap: 6px; flex: 1; flex-wrap: wrap; }
    .entry-type, .entry-start, .entry-end {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 6px;
    }
    .entry-start, .entry-end { width: 64px; text-align: center; }
    .entry-int { display: flex; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; }
    .entry-del {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 5px;
      padding: 3px 8px;
      cursor: pointer;
      margin-left: auto;
    }
    .entry-del:hover { background: var(--danger); color: #11111b; }
    .badge-system {
      background: var(--border);
      color: var(--muted);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      margin-left: auto;
    }
    .entry-effects {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      width: 100%;
      padding-top: 6px;
      margin-top: 4px;
      border-top: 1px dashed var(--border);
    }
    .effect-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--panel-2);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 14px;
      padding: 2px 4px 2px 10px;
      font-size: 12px;
    }
    .chip-x {
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }
    .chip-x:hover { color: var(--danger); }
    .effect-add {
      background: var(--panel-2);
      color: var(--text);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 2px 8px;
      cursor: pointer;
    }
    #footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      bottom: 0;
    }
    .btn-save {
      background: var(--accent-2);
      color: #11111b;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-cancel {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 18px;
      cursor: pointer;
    }
    .hint { color: var(--muted); font-size: 11px; padding: 0 16px 10px; }
  </style>
</head>
<body>
  <header>
    <h1>动画日程</h1>
    <p>配置每个时间段的动画效果。可为同一时段添加多个 GIF，桌宠会随机播放。</p>
  </header>

  <div id="add-section">
    <button class="btn-add" id="btn-add-scheduled">+ 添加定时动画</button>
    <button class="btn-add" id="btn-add-timed">+ 添加时段动画</button>
    <button class="btn-import" id="btn-import-gif">📥 导入 GIF</button>
  </div>

  <div class="list-title">定时动画（精确时刻，不可打断）</div>
  <div id="scheduled-list"></div>

  <div class="list-title">时段动画（时间窗，可打断，如三餐/睡眠）</div>
  <div id="timed-list"></div>

  <div class="list-title">系统内置（不可删除，可改效果）</div>
  <div id="system-list"></div>
  <div class="hint">系统内置时段：深夜熟睡、三餐。取消所有 GIF 即可停用该时段动画。</div>

  <div id="footer">
    <button class="btn-cancel" id="btn-cancel">取消</button>
    <button class="btn-save" id="btn-save">保存</button>
  </div>

  <script>
    const ALL_EFFECTS = [
      { value: "love520", label: "520（我爱你）" },
      { value: "love521", label: "521（我愿意）" },
      { value: "heart", label: "爱心" },
      { value: "jump", label: "弹跳" },
      { value: "mealtime", label: "用餐" },
      { value: "sleep", label: "入睡" },
      { value: "sleep2", label: "熟睡" },
      { value: "morningReading", label: "晨读" },
      { value: "morningDrink", label: "晨饮" },
      { value: "afterWork", label: "下班" },
      { value: "send", label: "发送" },
      { value: "good", label: "点赞" },
      { value: "delete", label: "删除" },
      { value: "undo", label: "撤销" },
      { value: "special", label: "特殊" },
      { value: "music", label: "音乐" },
      { value: "scroll", label: "滚动" },
      { value: "default", label: "默认（睡眠）" },
    ];

    let scheduleData = { windows: [], system: [] };
    let customGifList = [];

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function labelFor(value) {
      const builtin = ALL_EFFECTS.find(e => e.value === value);
      if (builtin) return builtin.label;
      const custom = customGifList.find(g => g.value === value);
      if (custom) return custom.label;
      return value;
    }
    const uid = () => "u" + Math.random().toString(36).slice(2, 9);
    function findEntry(id) {
      return scheduleData.windows.find(e => e.id === id) || scheduleData.system.find(e => e.id === id);
    }

    function renderEntry(entry, index, isSystem) {
      const effectChips = (entry.effects || []).map(e =>
        `<span class="effect-chip" data-effect="${e}">${escapeHtml(labelFor(e))}<button class="chip-x" data-effect="${e}" title="移除">×</button></span>`
      ).join("");
      const builtinOpts = ALL_EFFECTS.map(e => `<option value="${e.value}">${e.label}</option>`).join("");
      const customOpts = customGifList.length
        ? `<optgroup label="我的 GIF">${customGifList.map(g => `<option value="${g.value}">${escapeHtml(g.label)}</option>`).join("")}</optgroup>`
        : "";
      return `
      <div class="entry" data-id="${entry.id}" data-index="${index}" data-system="${isSystem}">
        <div class="drag-handle">⠿</div>
        <div class="entry-head">
          <select class="entry-type" data-index="${index}" ${isSystem ? "disabled" : ""}>
            <option value="scheduled" ${entry.type === "scheduled" ? "selected" : ""}>定时</option>
            <option value="timed" ${entry.type === "timed" ? "selected" : ""}>时段</option>
          </select>
          <input class="entry-start" data-field="start" data-index="${index}" value="${entry.start || ""}" />
          <span class="entry-sep">${entry.type === "scheduled" ? "" : "至"}</span>
          <input class="entry-end" data-field="end" data-index="${index}" value="${entry.end || ""}" ${entry.type === "scheduled" ? "disabled" : ""} />
          <label class="entry-int"><input type="checkbox" data-field="interruptible" data-index="${index}" ${entry.interruptible ? "checked" : ""} />可打断</label>
          ${isSystem
            ? '<span class="badge-system">系统</span>'
            : `<button class="entry-del" data-index="${index}">删除</button>`}
        </div>
        <div class="entry-effects" data-id="${entry.id}">
          ${effectChips}
          <select class="effect-add" data-id="${entry.id}">
            <option value="">+ 添加 GIF</option>
            <optgroup label="内置动画">${builtinOpts}</optgroup>
            ${customOpts}
          </select>
        </div>
      </div>`;
    }

    function render() {
      const scheduled = scheduleData.windows.filter(e => e.type === "scheduled");
      const timed = scheduleData.windows.filter(e => e.type === "timed");
      const scheduledHtml = scheduled.map((e, i) => renderEntry(e, i, false)).join("");
      const timedHtml = timed.map((e, i) => renderEntry(e, scheduled.length + i, false)).join("");
      const systemHtml = scheduleData.system.map((e, i) => renderEntry(e, scheduleData.windows.length + i, true)).join("");
      document.getElementById("scheduled-list").innerHTML = scheduledHtml;
      document.getElementById("timed-list").innerHTML = timedHtml;
      document.getElementById("system-list").innerHTML = systemHtml;
    }

    function readFromDOM() {
      const windows = [];
      document.querySelectorAll('#scheduled-list .entry, #timed-list .entry').forEach(el => {
        const id = el.dataset.id;
        const entry = scheduleData.windows.find(e => e.id === id);
        const type = el.querySelector('.entry-type').value;
        const base = {
          id,
          type,
          start: el.querySelector('[data-field="start"]').value,
          effects: entry ? (entry.effects || []) : [],
          interruptible: type === "scheduled" ? false : el.querySelector('[data-field="interruptible"]').checked,
          enabled: true,
        };
        if (type === "timed") base.end = el.querySelector('[data-field="end"]').value;
        windows.push(base);
      });
      const system = scheduleData.system.map(e => ({
        ...e,
        effects: e.effects || [],
        enabled: document.querySelector(`[data-id="${e.id}"] [data-field="interruptible"]`)?.checked ?? e.enabled,
      }));
      return { windows, system };
    }

    // ---- Event delegation ----
    document.addEventListener("change", (e) => {
      const t = e.target;
      if (t.classList.contains("entry-type") || t.classList.contains("entry-start") || t.classList.contains("entry-end") || t.classList.contains("entry-int")) {
        const id = t.closest('.entry').dataset.id;
        const entry = scheduleData.windows.find(en => en.id === id);
        if (!entry) return;
        const field = t.dataset.field;
        if (t.classList.contains("entry-type")) entry.type = t.value;
        else if (field === "interruptible") entry[field] = t.checked;
        else entry[field] = t.value;
        render();
      } else if (t.classList.contains("effect-add")) {
        const id = t.dataset.id;
        const val = t.value;
        if (val) {
          const entry = findEntry(id);
          if (entry && !entry.effects.includes(val)) entry.effects.push(val);
        }
        t.value = "";
        render();
      }
    });

    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("chip-x")) {
        const container = e.target.closest(".entry-effects");
        const id = container.dataset.id;
        const val = e.target.dataset.effect;
        const entry = findEntry(id);
        if (entry) entry.effects = entry.effects.filter(x => x !== val);
        render();
      } else if (e.target.classList.contains("entry-del")) {
        const id = e.target.closest('.entry').dataset.id;
        const idx = scheduleData.windows.findIndex(en => en.id === id);
        if (idx >= 0) scheduleData.windows.splice(idx, 1);
        render();
      }
    });

    // ---- Drag reorder ----
    let draggedEntry = null;
    let placeholder = null;
    document.addEventListener("mousedown", (e) => {
      const handle = e.target.closest(".drag-handle");
      if (!handle) return;
      const entryEl = handle.closest(".entry");
      draggedEntry = { el: entryEl, id: entryEl.dataset.id };
      placeholder = document.createElement("div");
      placeholder.className = "entry placeholder";
      placeholder.style.height = entryEl.offsetHeight + "px";
      entryEl.parentNode.insertBefore(placeholder, entryEl.nextSibling);
      entryEl.classList.add("dragging");
    });
    document.addEventListener("mousemove", (e) => {
      if (!draggedEntry) return;
      const elUnder = document.elementFromPoint(e.clientX, e.clientY);
      const entryEl = elUnder && elUnder.closest('.entry:not(.placeholder)');
      if (entryEl && entryEl !== draggedEntry.el) {
        const rect = entryEl.getBoundingClientRect();
        const before = (e.clientY - rect.top) / rect.height < 0.5;
        entryEl.parentNode.insertBefore(placeholder, before ? entryEl : entryEl.nextSibling);
      }
    });
    document.addEventListener("mouseup", () => {
      if (!draggedEntry) return;
      const entries = [...document.querySelectorAll('#scheduled-list .entry, #timed-list .entry')];
      const dropIdx = entries.indexOf(placeholder);
      const orderedIds = entries
        .filter(el => el !== draggedEntry.el && el !== placeholder)
        .map(el => el.dataset.id);
      orderedIds.splice(dropIdx < 0 ? orderedIds.length : dropIdx, 0, draggedEntry.id);
      // Reorder scheduleData.windows to match the new visual order
      const byId = new Map(scheduleData.windows.map(e => [e.id, e]));
      const reordered = orderedIds.map(id => byId.get(id)).filter(Boolean);
      for (const e of scheduleData.windows) if (!orderedIds.includes(e.id)) reordered.push(e);
      scheduleData.windows = reordered;
      if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
      draggedEntry.el.classList.remove("dragging");
      draggedEntry = null;
      placeholder = null;
      render();
    });

    // ---- Buttons ----
    document.getElementById("btn-add-scheduled").addEventListener("click", () => {
      scheduleData.windows.push({ id: uid(), type: "scheduled", start: "12:00", effects: [], interruptible: false, enabled: true });
      render();
    });
    document.getElementById("btn-add-timed").addEventListener("click", () => {
      scheduleData.windows.push({ id: uid(), type: "timed", start: "12:00", end: "13:00", effects: [], interruptible: true, enabled: true });
      render();
    });
    document.getElementById("btn-import-gif").addEventListener("click", async () => {
      const res = await window.linePuppySettings.importGif();
      if (res && res.ok && res.asset) {
        if (!customGifList.find(g => g.value === res.asset.value)) customGifList.push(res.asset);
        render();
      }
    });
    document.getElementById("btn-cancel").addEventListener("click", () => window.close());
    document.getElementById("btn-save").addEventListener("click", async () => {
      const res = await window.linePuppySettings.saveSchedule(readFromDOM());
      if (res && !res.ok) {
        alert("保存失败：" + (res.error || "未知错误"));
        return;
      }
      window.close();
    });

    // ---- Init ----
    const normalize = (e) => {
      if (!e.effects) e.effects = e.effect ? [e.effect] : [];
      delete e.effect;
      return e;
    };
    window.linePuppySettings.loadSchedule()
      .then(data => {
        scheduleData = {
          windows: (data.windows || []).map(normalize),
          system: (data.system || []).map(normalize),
        };
        return window.linePuppySettings.getCustomGifs();
      })
      .then(custom => {
        customGifList = Array.isArray(custom) ? custom : [];
        render();
      });
  </script>
</body>
</html>
