<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>动画日程 · line puppy</title>
<style>
:root {
  --bg: #181825;
  --panel: #1e1e2e;
  --card: #232336;
  --card-2: #2a2a40;
  --text: #e6e6f0;
  --muted: #9a9ab0;
  --accent: #89b4fa;
  --accent-2: #a6e3a1;
  --border: #363650;
  --danger: #f38ba8;
  --sys: #6c6c94;
  --radius: 12px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
}
header {
  padding: 18px 20px 14px;
  background: linear-gradient(180deg, #232336, #1e1e2e);
  border-bottom: 1px solid var(--border);
}
header h1 { margin: 0 0 4px; font-size: 17px; }
header p { margin: 0; color: var(--muted); font-size: 12px; }
main { padding: 16px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
.card-title { margin: 0 0 2px; font-size: 14px; font-weight: 700; }
.card-desc { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
button, select, input { font-family: inherit; font-size: 13px; }
.btn-add, .btn-import, .btn-save, .btn-cancel {
  border-radius: 8px; cursor: pointer; font-weight: 600; border: 1px solid transparent;
}
.btn-add { background: var(--accent); color: #11111b; padding: 7px 12px; }
.btn-import { background: var(--card-2); color: var(--text); border-color: var(--border); padding: 7px 12px; }
.btn-add:hover, .btn-import:hover { filter: brightness(1.08); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---- 24h timeline ---- */
.tl-axis { position: relative; height: 16px; margin: 8px 0 2px; font-size: 10px; color: var(--muted); }
.tl-tick { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-track {
  position: relative; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; margin-top: 2px; overflow: visible;
}
.tl-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); opacity: .55; }
.tl-now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--danger); z-index: 7; box-shadow: 0 0 6px rgba(243,139,168,.7); }
.tl-block {
  position: absolute; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; color: #1f1f2e; font-weight: 700; cursor: grab;
  background: var(--accent); overflow: hidden; white-space: nowrap;
  box-shadow: 0 1px 3px rgba(0,0,0,.35); z-index: 2; user-select: none;
}
.tl-block.tl-timed { padding: 0 8px; height: 38px; font-size: 12px; }
.tl-block.tl-scheduled { padding: 0 8px; border-radius: 12px; height: 24px; font-size: 11px; }
.tl-block.sel { outline: 2px solid var(--accent-2); outline-offset: 1px; z-index: 6; }
.tl-block:active { cursor: grabbing; }
.tl-time-big { font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 rgba(255,255,255,.18); }
.tl-handle { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.tl-handle.tl-l { left: 0; } .tl-handle.tl-r { right: 0; }
.tl-handle:after { content: ""; position: absolute; top: 10px; bottom: 10px; left: 3px; width: 1px; background: rgba(31,31,46,.45); }
.tl-block:hover .tl-handle:after { background: rgba(31,31,46,.85); }

/* ---- editor ---- */
.tl-editor { margin-top: 12px; padding: 12px; border: 1px solid var(--accent); border-radius: 10px; background: var(--card-2); }
.ed-head { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
.ed-head b { font-weight: 700; }
.ed-close { margin-left: auto; background: transparent; border: none; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
.ed-close:hover { color: var(--danger); }
.ed-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.ed-row label { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
.ed-row select, .ed-row input[type="time"] {
  background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px;
}
.ed-del { background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.ed-del:hover { background: var(--danger); color: #11111b; }
.effect-chip {
  display: inline-flex; align-items: center; gap: 4px; background: var(--panel);
  border: 1px solid var(--accent); color: var(--accent); border-radius: 14px;
  padding: 2px 4px 2px 10px; font-size: 12px;
}
.chip-x { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
.chip-x:hover { color: var(--danger); }
.effect-add { background: var(--panel); color: var(--text); border: 1px dashed var(--border); border-radius: 14px; padding: 4px 8px; cursor: pointer; }
.hint { color: var(--muted); font-size: 11px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 11px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ---- my gifs ---- */
.gif-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--border); }
.gif-item:first-child { border-top: none; }
.gif-thumb { width: 34px; height: 34px; object-fit: contain; background: var(--panel); border-radius: 6px; border: 1px solid var(--border); flex: 0 0 auto; }
.gif-label { flex: 1; word-break: break-all; }
.gif-del { background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 6px; padding: 3px 10px; cursor: pointer; flex: 0 0 auto; }
.gif-del:hover { background: var(--danger); color: #11111b; }

#footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 16px 20px; border-top: 1px solid var(--border); background: var(--panel); position: sticky; bottom: 0; }
.btn-save { background: var(--accent-2); color: #11111b; padding: 8px 18px; }
.btn-cancel { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 8px 18px; }
</style>
</head>
<body>
<header>
  <h1>动画日程</h1>
  <p>一条 24 小时时间轴看清全天的动图安排：拖动色块改时间，拖两端改时长。</p>
</header>

<main>
  <!-- 24h 时间轴 -->
  <section class="card">
    <h2 class="card-title">24 小时时间轴</h2>
    <p class="card-desc">横条=时段，圆角小标记=定时；颜色代表动画类别（图例）。点色块编辑，拖动改时间，拖两端改时长。</p>
    <div class="tl-axis" id="tl-axis"></div>
    <div class="tl-track" id="tl-track"></div>
    <div class="row-actions">
      <button class="btn-add" id="btn-add-scheduled">+ 定时动画</button>
      <button class="btn-add" id="btn-add-timed">+ 时段动画</button>
    </div>
    <div class="tl-editor" id="tl-editor" hidden></div>
    <div class="legend" id="tl-legend"></div>
  </section>

  <!-- 我的 GIF -->
  <section class="card">
    <h2 class="card-title">🖼 我的 GIF</h2>
    <p class="card-desc">导入自己的动图，然后在时间轴色块的效果里选用。</p>
    <button class="btn-import" id="btn-import-gif">📁 导入 GIF</button>
    <div id="custom-gifs-list"></div>
  </section>
</main>

<div id="footer">
  <button class="btn-cancel" id="btn-cancel">取消</button>
  <button class="btn-save" id="btn-save">保存</button>
</div>

<script>
const ALL_EFFECTS = [
  { value: "love520", label: "520（我爱你）" },
  { value: "love521", label: "521（我愿意）" },
  { value: "heart", label: "爱心" },
  { value: "jump", label: "弹跳" },
  { value: "mealtime", label: "用餐" },
  { value: "sleep", label: "入睡" },
  { value: "sleep2", label: "熟睡" },
  { value: "morningReading", label: "晨读" },
  { value: "morningDrink", label: "晨饮" },
  { value: "afterWork", label: "下班" },
  { value: "send", label: "发送" },
  { value: "good", label: "点赞" },
  { value: "delete", label: "删除" },
  { value: "undo", label: "撤销" },
  { value: "special", label: "特殊" },
  { value: "music", label: "音乐" },
  { value: "scroll", label: "滚动" },
  { value: "default", label: "默认（睡眠）" },
];

const ROW_H = 46;

const CATS = {
  love:   { color: "#f38ba8", name: "爱情",      effects: ["love520","love521","heart"] },
  meal:   { color: "#fab387", name: "用餐",      effects: ["mealtime","morningDrink"] },
  sleep:  { color: "#cba6f7", name: "睡眠",      effects: ["sleep","sleep2","default"] },
  work:   { color: "#94e2d5", name: "学习·工作",  effects: ["morningReading","afterWork"] },
  act:    { color: "#89dceb", name: "互动",      effects: ["send","good","delete","undo","jump"] },
  media:  { color: "#f5c2e7", name: "媒体",      effects: ["music","scroll","special"] },
  custom: { color: "#f9e2af", name: "自定义·GIF", match: v => /^user\//.test(v) },
  empty:  { color: "#6c7080", name: "未设置" },
};
const CAT_ORDER = ["love","meal","sleep","work","act","media","custom","empty"];
function categoryOf(v) {
  for (const k of CAT_ORDER) {
    const c = CATS[k];
    if (c.match && c.match(v)) return k;
    if (c.effects && c.effects.includes(v)) return k;
  }
  return "empty";
}
function darken(hex, amt) {
  amt = amt == null ? 0.6 : amt;
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
  if (!m) return hex;
  const r = Math.round(parseInt(m[1],16)*amt);
  const g = Math.round(parseInt(m[2],16)*amt);
  const b = Math.round(parseInt(m[3],16)*amt);
  return "#" + [r,g,b].map(x => x.toString(16).padStart(2,"0")).join("");
}
function blockColor(value, isSys) {
  const c = CATS[categoryOf(value)] || CATS.empty;
  return isSys ? darken(c.color) : c.color;
}
function renderLegend() {
  const el = document.getElementById("tl-legend");
  if (!el) return;
  el.innerHTML =
    CAT_ORDER.filter(k => k !== "empty").map(k =>
      `<span><i style="background:${CATS[k].color}"></i>${CATS[k].name}</span>`
    ).join("") +
    `<span><i style="background:#5b5b75"></i>系统内置（颜色偏暗）</span>` +
    `<span><i style="background:var(--danger);height:2px;width:14px;border-radius:0"></i>当前时间</span>`;
}

let scheduleData = { windows: [], system: [] };
let customGifList = [];
let selectedId = null;
let drag = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function labelFor(value) {
  const builtin = ALL_EFFECTS.find(e => e.value === value);
  if (builtin) return builtin.label;
  const custom = customGifList.find(g => g.value === value);
  if (custom) return custom.label;
  return value;
}
const uid = () => "u" + Math.random().toString(36).slice(2, 9);
function findEntry(id) {
  return scheduleData.windows.find(e => e.id === id) || scheduleData.system.find(e => e.id === id);
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function timeToMin(s) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || ""));
  if (!m) return 0;
  return clamp(parseInt(m[1], 10) * 60 + parseInt(m[2], 10), 0, 1440);
}
function minToTime(m) {
  m = clamp(Math.round(m), 0, 1440);
  const h = Math.floor(m / 60), mm = m % 60;
  return String(h).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}

function buildBlocks() {
  const items = [];
  const all = [...scheduleData.windows.map(e => [e, false]), ...scheduleData.system.map(e => [e, true])];
  for (const [e, isSys] of all) {
    const s = timeToMin(e.start || "00:00");
    const isTimed = e.type === "timed";
    let en = isTimed ? timeToMin(e.end || "00:00") : s + 30;
    if (en <= s) en = s + (isTimed ? 15 : 30);
    en = Math.min(1440, en);
    items.push({ entry: e, isSys, isTimed, startMin: s, endMin: en });
  }
  items.sort((a, b) => a.startMin - b.startMin || a.endMin - b.endMin);
  const laneEnds = [];
  for (const it of items) {
    // reserve a bit of extra lane space for scheduled markers so their labels don't collide
    const reserve = it.isTimed ? it.endMin : it.endMin + 15;
    let lane = 0;
    while (lane < laneEnds.length && laneEnds[lane] > it.startMin) lane++;
    it.lane = lane;
    laneEnds[lane] = reserve;
  }
  return items;
}

function renderAxis() {
  const axis = document.getElementById("tl-axis");
  let html = "";
  for (let h = 0; h <= 24; h += 2) {
    html += `<span class="tl-tick" style="left:${(h / 24 * 100).toFixed(4)}%">${h}:00</span>`;
  }
  axis.innerHTML = html;
}

function blockHtml(b) {
  const e = b.entry;
  const left = (b.startMin / 1440 * 100).toFixed(4);
  const top = b.lane * ROW_H + 4;
  const sel = e.id === selectedId ? " sel" : "";
  const effs = e.effects || [];
  const color = blockColor(effs[0] || "", b.isSys);
  const labelText = effs.map(labelFor).join("、") || "未设置动图";
  const timeStr = b.isTimed ? `${e.start || ""}–${e.end || ""}` : (e.start || "");
  const title = (b.isSys ? "【系统内置】" : "") + labelText + "  " + timeStr;
  if (b.isTimed) {
    const width = Math.max(1.6, (b.endMin - b.startMin) / 1440 * 100).toFixed(4);
    return `<div class="tl-block tl-timed${sel}" data-id="${e.id}" title="${escapeHtml(title)}" style="left:${left}%;width:${width}%;top:${top}px;background:${color}">
      <span class="tl-time-big">${escapeHtml(timeStr)}</span>
      <span class="tl-handle tl-l"></span><span class="tl-handle tl-r"></span>
    </div>`;
  }
  return `<div class="tl-block tl-scheduled${sel}" data-id="${e.id}" title="${escapeHtml(title)}" style="left:${left}%;top:${top}px;background:${color}">
    <span class="tl-time-big">${escapeHtml(timeStr)}</span>
  </div>`;
}

function renderTimeline() {
  const track = document.getElementById("tl-track");
  const blocks = buildBlocks();
  const lanes = blocks.length ? Math.max(...blocks.map(b => b.lane + 1)) : 1;
  track.style.height = (lanes * ROW_H + 8) + "px";
  let grid = "";
  for (let h = 0; h <= 24; h += 2) grid += `<div class="tl-grid" style="left:${(h / 24 * 100).toFixed(4)}%"></div>`;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const nowLine = `<div class="tl-now" style="left:${(nowMin / 1440 * 100).toFixed(4)}%"></div>`;
  track.innerHTML = grid + nowLine + blocks.map(blockHtml).join("");
}

function renderEditor() {
  const ed = document.getElementById("tl-editor");
  if (!selectedId) { ed.hidden = true; ed.innerHTML = ""; return; }
  const e = findEntry(selectedId);
  if (!e) { selectedId = null; ed.hidden = true; ed.innerHTML = ""; return; }
  const isSys = scheduleData.system.includes(e);
  const isTimed = e.type === "timed";
  const chips = (e.effects || []).map(ev =>
    `<span class="effect-chip" data-effect="${escapeHtml(ev)}">${escapeHtml(labelFor(ev))}<button class="chip-x" data-effect="${escapeHtml(ev)}" title="移除">×</button></span>`
  ).join("") || '<span class="hint">（还没有动图，右侧添加）</span>';
  const builtinOpts = ALL_EFFECTS.map(x => `<option value="${x.value}">${x.label}</option>`).join("");
  const customOpts = customGifList.length
    ? `<optgroup label="我的 GIF">${customGifList.map(g => `<option value="${g.value}">${escapeHtml(g.label)}</option>`).join("")}</optgroup>`
    : "";
  ed.hidden = false;
  ed.innerHTML = `
    <div class="ed-head"><b>编辑${isSys ? "（系统内置）" : ""}</b><button class="ed-close" title="收起">×</button></div>
    <div class="ed-row">
      ${isSys ? "" : `<label>类型 <select class="ed-type"><option value="scheduled" ${!isTimed ? "selected" : ""}>定时（时间点）</option><option value="timed" ${isTimed ? "selected" : ""}>时段（时间段）</option></select></label>`}
      <label>开始 <input type="time" class="ed-start" value="${e.start || ""}"></label>
      ${isTimed ? `<label>结束 <input type="time" class="ed-end" value="${e.end || ""}"></label>` : ""}
      <label><input type="checkbox" class="ed-enabled" ${e.enabled !== false ? "checked" : ""}> 启用</label>
    </div>
    <div class="ed-row"><span class="hint">动图：</span>${chips}<select class="effect-add"><option value="">+ 添加动图</option><optgroup label="内置动画">${builtinOpts}</optgroup>${customOpts}</select></div>
    <div class="ed-row">${isSys ? '<span class="hint">系统内置动画不能删除，可停用或调整时间。</span>' : '<button class="ed-del">删除该动画</button>'}</div>
  `;
}

function selectEntry(id) {
  selectedId = id;
  renderTimeline();
  renderEditor();
}

// ---- drag: move block / resize edges (timed) ----
document.getElementById("tl-track").addEventListener("mousedown", (e) => {
  const block = e.target.closest(".tl-block");
  if (!block || e.button !== 0) return;
  const id = block.dataset.id;
  const entry = findEntry(id);
  if (!entry) return;
  const handle = e.target.classList.contains("tl-handle") ? (e.target.classList.contains("tl-l") ? "l" : "r") : null;
  const isTimed = entry.type === "timed";
  const startMin = timeToMin(entry.start || "00:00");
  const endMin = isTimed ? timeToMin(entry.end || "00:00") : startMin + 30;
  drag = { id, entry, isTimed, handle, startMin, endMin, x0: e.clientX, moved: false };
  document.body.style.userSelect = "none";
  e.preventDefault();
});
document.addEventListener("mousemove", (e) => {
  if (!drag) return;
  const trackW = document.getElementById("tl-track").clientWidth || 1;
  const deltaMin = ((e.clientX - drag.x0) / trackW) * 1440;
  if (Math.abs(e.clientX - drag.x0) > 3) drag.moved = true;
  const SNAP = 5; // minutes
  const snap = (m) => Math.round(m / SNAP) * SNAP;
  if (drag.handle === "l" && drag.isTimed) {
    let ns = clamp(drag.startMin + deltaMin, 0, drag.endMin - 5);
    drag.entry.start = minToTime(snap(ns));
    if (drag.entry.start >= drag.entry.end) drag.entry.start = minToTime(drag.endMin - 5);
  } else if (drag.handle === "r" && drag.isTimed) {
    let ne = clamp(drag.endMin + deltaMin, drag.startMin + 5, 1440);
    drag.entry.end = minToTime(snap(ne));
    if (drag.entry.end <= drag.entry.start) drag.entry.end = minToTime(drag.startMin + 5);
  } else {
    const dur = drag.endMin - drag.startMin;
    let ns = clamp(drag.startMin + deltaMin, 0, 1440 - dur);
    drag.entry.start = minToTime(snap(ns));
    if (drag.isTimed) drag.entry.end = minToTime(timeToMin(drag.entry.start) + dur);
  }
  renderTimeline();
});
document.addEventListener("mouseup", () => {
  if (!drag) return;
  const id = drag.id;
  drag = null;
  document.body.style.userSelect = "";
  renderTimeline();
  selectEntry(id);
});

// ---- editor events ----
document.getElementById("tl-editor").addEventListener("change", (e) => {
  if (!selectedId) return;
  const entry = findEntry(selectedId);
  if (!entry) return;
  const t = e.target;
  if (t.classList.contains("ed-type")) {
    entry.type = t.value;
    if (entry.type === "timed") {
      if (!entry.end) entry.end = entry.start || "12:00";
      entry.interruptible = entry.interruptible ?? true;
    } else {
      delete entry.end;
      entry.interruptible = false;
    }
    renderEditor(); renderTimeline();
  } else if (t.classList.contains("ed-start")) {
    entry.start = t.value; renderTimeline();
  } else if (t.classList.contains("ed-end")) {
    entry.end = t.value; renderTimeline();
  } else if (t.classList.contains("ed-enabled")) {
    entry.enabled = t.checked;
  } else if (t.classList.contains("effect-add")) {
    const v = t.value;
    if (v) { entry.effects = entry.effects || []; if (!entry.effects.includes(v)) entry.effects.push(v); }
    t.value = "";
    renderEditor(); renderTimeline();
  }
});
document.getElementById("tl-editor").addEventListener("click", (e) => {
  if (!selectedId) return;
  const entry = findEntry(selectedId);
  if (!entry) return;
  if (e.target.classList.contains("chip-x")) {
    const v = e.target.dataset.effect;
    entry.effects = (entry.effects || []).filter(x => x !== v);
    renderEditor(); renderTimeline();
  } else if (e.target.classList.contains("ed-close")) {
    selectedId = null; renderEditor(); renderTimeline();
  } else if (e.target.classList.contains("ed-del")) {
    const id = selectedId;
    scheduleData.windows = scheduleData.windows.filter(en => en.id !== id);
    selectedId = null; renderEditor(); renderTimeline();
  }
});

// ---- buttons ----
document.getElementById("btn-add-scheduled").addEventListener("click", () => {
  const id = uid();
  scheduleData.windows.push({ id, type: "scheduled", start: "12:00", effects: [], interruptible: false, enabled: true });
  selectEntry(id);
});
document.getElementById("btn-add-timed").addEventListener("click", () => {
  const id = uid();
  scheduleData.windows.push({ id, type: "timed", start: "12:00", end: "13:00", effects: [], interruptible: true, enabled: true });
  selectEntry(id);
});
document.getElementById("btn-import-gif").addEventListener("click", async () => {
  const res = await window.linePuppySettings.importGif();
  if (res && res.ok && res.asset) {
    if (!customGifList.find(g => g.value === res.asset.value)) customGifList.push(res.asset);
    renderCustomGifs();
    renderEditor();
  }
});
document.getElementById("btn-cancel").addEventListener("click", () => window.close());
document.getElementById("btn-save").addEventListener("click", async () => {
  const res = await window.linePuppySettings.saveSchedule({
    windows: scheduleData.windows.map(e => ({ ...e, effects: e.effects || [] })),
    system: scheduleData.system.map(e => ({ ...e, effects: e.effects || [], enabled: e.enabled !== false })),
  });
  if (res && !res.ok) { alert("保存失败：" + (res.error || "未知错误")); return; }
  window.close();
});

// ---- my gifs ----
function renderCustomGifs() {
  const list = document.getElementById("custom-gifs-list");
  if (!customGifList.length) {
    list.innerHTML = '<div class="hint" style="padding-top:8px">暂无导入的 GIF。点击上方「📁 导入 GIF」添加你自己的动图。</div>';
    return;
  }
  list.innerHTML = customGifList.map(g => `
    <div class="gif-item" data-value="${escapeHtml(g.value)}">
      <img class="gif-thumb" src="gif://${encodeURIComponent(g.file)}" alt="" onerror="this.style.display='none'" />
      <span class="gif-label">${escapeHtml(g.label)}</span>
      <button class="gif-del" data-value="${escapeHtml(g.value)}" title="删除该 GIF">删除</button>
    </div>`).join("");
}
document.getElementById("custom-gifs-list").addEventListener("click", async (e) => {
  const btn = e.target.closest(".gif-del");
  if (!btn) return;
  const value = btn.dataset.value;
  const asset = customGifList.find(g => g.value === value);
  const label = asset ? asset.label : value;
  if (!confirm(`确定删除 GIF「${label}」吗？\n该文件将被永久删除，且所有引用它的动画时段也会一并移除。`)) return;
  const res = await window.linePuppySettings.deleteGif(value);
  if (res && res.ok) {
    const strip = (entry) => { if (entry.effects) entry.effects = entry.effects.filter(x => x !== value); };
    scheduleData.windows.forEach(strip);
    scheduleData.system.forEach(strip);
    customGifList = customGifList.filter(g => g.value !== value);
    renderTimeline();
    renderEditor();
    renderCustomGifs();
  } else {
    alert("删除失败：" + (res && res.error ? res.error : "未知错误"));
  }
});

// ---- init ----
const normalize = (e) => {
  if (!e.effects) e.effects = e.effect ? [e.effect] : [];
  delete e.effect;
  return e;
};
function reloadAll() {
  return window.linePuppySettings.loadSchedule()
    .then(data => {
      scheduleData = {
        windows: (data.windows || []).map(normalize),
        system: (data.system || []).map(normalize),
      };
      return window.linePuppySettings.getCustomGifs();
    })
    .then(custom => {
      customGifList = Array.isArray(custom) ? custom : [];
      renderLegend();
      renderAxis();
      renderTimeline();
      renderEditor();
      renderCustomGifs();
    });
}
reloadAll();
// keep the "now" marker fresh
setInterval(() => { if (!drag) renderTimeline(); }, 60000);
</script>
</body>
